<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phan World</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="scene">
    <!-- Background -->
    <img src="icons/phanworld_background_1.png" id="background" alt="background" />

    <p class="instructions">"Click on the house"</p>
    <!-- Clickable area on top of background -->
    <div id="mailbox_click_area"></div>
    <div id="panda_click_area"></div>
    <div id="house_click_area"></div>

    <!-- Popup icon -->
    <img src="icons/phanworld_house_icon.png" id="popup-icon" alt="House Popup"/>
    <img src="icons/phanworld_mailbox.png" id="mailbox_popup" alt="mailbox Popup"/>
    <img src="icons/phanworld_panda.png" id="panda_popup" alt="panda Popup"/>
  </div>                                                                                                                                                                                                                                

  <script src="mailbox.js"></script>
  <script src="panda.js"></script>
  <script src="app.js"></script>
</body>
 
</html>
